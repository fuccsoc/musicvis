appId: com.fuccsoc.musicvis
productName: musicvis
files:
  - dist/**
  - package.json
extraResources:
  - from: resources/native
    to: native
    filter:
      - AudioCaptureHelper
      - MediaRemoteHelper
      - libMediaRemoteAdapter.dylib
      - MediaRemoteAdapter.framework/**
mac:
  category: public.app-category.music
  target:
    - dmg
    - zip
